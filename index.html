<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Német szótanuló</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='21.33' fill='%23000'/%3E%3Crect y='21.33' width='64' height='21.33' fill='%23DD0000'/%3E%3Crect y='42.66' width='64' height='21.34' fill='%23FFCE00'/%3E%3C/svg%3E">
<style>
    :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --good: #16a34a;
        --bad: #dc2626;
        --good-bg: #f0fdf4;
        --bad-bg: #fef2f2;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .container {
        width: min(900px, calc(100% - 32px));
        margin: 32px auto 60px;
    }

    h1 { margin: 0 0 8px; font-size: 30px; }
    h2 { margin: 0 0 18px; font-size: 22px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .hidden { display: none !important; }

    .catalog-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
    }

    button {
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font: inherit;
        cursor: pointer;
    }

    .catalog-button {
        text-align: left;
        background: #eef2ff;
        color: #312e81;
        border: 1px solid #c7d2fe;
        transition: .15s;
    }

    .catalog-button:hover {
        background: #e0e7ff;
        transform: translateY(-1px);
    }

    .word-list-type-title {
      margin-top: 22px;
      margin-bottom: 4px;
      padding-top: 8px;
      font-size: 17px;
      font-weight: 700;
      color: #163a63;
      border-top: 1px solid #dfe3ea;
    }
    .word-list-type-title:first-child {
      margin-top: 0;
      border-top: 0;
    }

    .catalog-button.selected {
        background: #dbeafe;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(37, 99, 235, .12);
    }

    .catalog-check {
        float: right;
        font-weight: 800;
        color: var(--good);
        margin-left: 10px;
    }

    .catalog-actions {
        display:flex;
        justify-content:flex-end;
        margin-top:18px;
    }

    .group-choice { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:20px; }
    .group-choice button { min-height:90px; font-size:18px; font-weight:650; }
    .choice-button { background:#eef2ff; color:#312e81; border:1px solid #c7d2fe; }
    .choice-button:hover { background:#e0e7ff; }
    .word-list { margin-top:18px; overflow-x:auto; }
    .word-list-row { display:grid; grid-template-columns:280px 28px minmax(180px,1fr); column-gap:8px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--border); font-size:17px; }
    .word-list-row .german { font-weight:600; }
    .word-list-row .dash { text-align:center; color:var(--muted); }
    .word-list-header { font-size:14px; color:var(--muted); font-weight:650; border-bottom:2px solid var(--border); }
    .verb-list-row {
        display:grid;
        grid-template-columns: minmax(230px, 1.2fr) minmax(120px, 1fr) minmax(130px, 1fr) minmax(150px, 1.2fr);
        column-gap:18px;
        align-items:baseline;
        padding:7px 0;
        border-bottom:1px solid var(--border);
        font-size:17px;
    }
    .verb-list-row .german { font-weight:600; }
    .verb-list-header { font-size:14px; color:var(--muted); font-weight:650; border-bottom:2px solid var(--border); }
    .verb-hu { color:var(--muted); font-size:14px; font-weight:400; }
    .verb-question-infinitiv { font-size:38px; font-weight:700; line-height:1.15; }
    .verb-question-hu { color:var(--muted); font-size:16px; font-weight:400; margin-top:8px; }
    .verb-question .word { margin-bottom:18px; }
    .verb-answers {
        width: min(600px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 12px;
    }
    .verb-answer-row {
        display: grid;
        grid-template-columns: 130px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        text-align: left;
    }
    .verb-answer-row label {
        font-weight: 650;
    }
    .verb-answer-row input {
        width: 100%;
    }
    .verb-feedback-lines {
        display: grid;
        gap: 4px;
    }
    .verb-feedback-line {
        font-weight: 600;
    }

    .noun-question .word { margin-bottom:18px; }
    .multi-answer-prefix {
        font-weight: 650;
        white-space: nowrap;
    }
    .multi-answer-row {
        display:grid;
        grid-template-columns: 130px minmax(0,1fr);
        align-items:center;
        gap:10px;
        text-align:left;
    }
    .mixed-question .word { margin-bottom:18px; }

    .primary {
        background: var(--accent);
        color: white;
        min-width: 120px;
    }

    .primary:hover { background: var(--accent-hover); }

    .secondary {
        background: #eef0f3;
        color: var(--text);
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
    }

    .progress {
        height: 9px;
        background: #e5e7eb;
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 24px;
    }

    .progress > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width .25s;
    }

    .question {
        text-align: center;
        padding: 24px 0 18px;
    }

    .question-label {
        color: var(--muted);
        font-size: 15px;
        margin-bottom: 8px;
    }

    .word {
        font-size: 40px;
        font-weight: 700;
        margin-bottom: 22px;
    }

    .answer-row {
        display: flex;
        max-width: 600px;
        margin: auto;
        gap: 10px;
    }

    input[type="text"] {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 20px;
        padding: 13px 15px;
        border: 2px solid var(--border);
        border-radius: 10px;
        outline: none;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    .feedback {
        min-height: 72px;
        margin-top: 20px;
        border-radius: 12px;
        padding: 15px 18px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
    }

    .feedback.good {
        color: var(--good);
        background: var(--good-bg);
        animation: pop .25s ease-out;
    }

    .feedback.bad {
        color: var(--bad);
        background: var(--bad-bg);
        animation: shake .28s ease-in-out;
    }

    .correct-answer {
        display: block;
        margin-top: 5px;
        font-weight: 700;
    }

    @keyframes pop {
        0% { transform: scale(.96); opacity: .5; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-7px); }
        75% { transform: translateX(7px); }
    }

    .results {
        margin-top: 28px;
    }

    .result-item {
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }

    .result-item:last-child { border-bottom: 0; }

    /* A lenyitható sor egyetlen rendezett sor legyen: nyíl | pipa | szöveg. */
    details.result-item > summary {
        display: grid;
        grid-template-columns: 18px 28px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        cursor: pointer;
        list-style: none;
    }

    details.result-item > summary::-webkit-details-marker {
        display: none;
    }

    details.result-item > summary::before {
        content: "▶";
        font-size: 12px;
        line-height: 26px;
        color: var(--text);
    }

    details.result-item[open] > summary::before {
        content: "▼";
    }

    .locked-result {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
    }

    .result-icon {
        line-height: 26px;
    }

    .result-icon.good { color: var(--good); font-weight: 800; }
    .result-icon.bad { color: var(--bad); font-weight: 800; }

    .result-hu { font-weight: 600; }
    .result-detail { color: var(--muted); }
    .result-detail strong { color: var(--text); }

    .summary {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .summary-number {
        font-size: 30px;
        font-weight: 750;
    }

    .summary-label {
        color: var(--muted);
        font-size: 14px;
    }

    .score-result {
        position: relative;
        flex: 0 0 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 18px 0 28px;
        min-height: 290px;
        overflow: hidden;
    }

    .score-ring {
        position: relative;
        width: 250px;
        height: 250px;
    }

    .score-ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        overflow: visible;
    }

    .score-ring-track,
    .score-ring-value {
        fill: none;
        stroke-width: 16;
    }

    .score-ring-track {
        stroke: #111827;
    }

    .score-ring-value {
        stroke-linecap: round;
        stroke-dasharray: 691.15;
        stroke-dashoffset: 691.15;
        animation: score-ring-fill 1.7s cubic-bezier(.2,.75,.25,1) forwards;
    }

    .score-ring.red .score-ring-value { stroke: #ef4444; }
    .score-ring.yellow .score-ring-value { stroke: #f5b400; }
    .score-ring.green .score-ring-value { stroke: #16b94a; }

    .score-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }

    .score-percent {
        font-size: 58px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -2px;
    }

    .score-ring.red .score-percent { color: #ef4444; }
    .score-ring.yellow .score-percent { color: #f5b400; }
    .score-ring.green .score-percent { color: #16b94a; }

    .score-caption {
        margin-top: 9px;
        color: var(--muted);
        font-size: 14px;
    }

    .score-stats {
        display: flex;
        justify-content: center;
        gap: 42px;
        margin-bottom: 24px;
        text-align: center;
    }

    @keyframes score-ring-fill {
        from { stroke-dashoffset: 691.15; }
    }

    .confetti {
        position: absolute;
        inset: 0;
        pointer-events: none;
    }

    .confetti span {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 14px;
        opacity: 0;
        animation: confetti-burst 1.4s ease-out forwards;
    }

    .confetti span:nth-child(3n) { background: #ef4444; }
    .confetti span:nth-child(3n+1) { background: #f5b400; }
    .confetti span:nth-child(3n+2) { background: #16b94a; }
    .confetti span:nth-child(4n) { transform: rotate(35deg); }
    .confetti span:nth-child(4n+1) { transform: rotate(-25deg); }
    .confetti span:nth-child(4n+2) { transform: rotate(65deg); }
    .confetti span:nth-child(4n+3) { transform: rotate(-55deg); }

    @keyframes confetti-burst {
        0% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
        100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(420deg); }
    }

    .history-list {
        display: grid;
        gap: 10px;
    }

    .history-item {
        width: 100%;
        text-align: left;
        background: #fafafa;
        border: 1px solid var(--border);
        padding: 15px;
    }

    .history-item:hover { background: #f3f4f6; }

    .history-main {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        font-weight: 650;
    }

    .history-meta {
        color: var(--muted);
        font-size: 14px;
        margin-top: 5px;
    }

    .empty {
        color: var(--muted);
        padding: 12px 0;
    }

    .error {
        color: var(--bad);
        background: var(--bad-bg);
        border-radius: 10px;
        padding: 14px;
        white-space: pre-wrap;
    }

    @media (max-width: 600px) {
        .word-list-row { grid-template-columns:220px 28px minmax(180px,1fr); }
        .verb-list-row { grid-template-columns: minmax(230px, 1.2fr) minmax(120px, 1fr) minmax(130px, 1fr) minmax(150px, 1.2fr); column-gap:10px; font-size:15px; }
        .container { width: min(100% - 20px, 900px); margin-top: 20px; }
        .card { padding: 18px; }
        .word { font-size: 32px; }
        .answer-row { flex-direction: column; }
        details.result-item > summary {
            grid-template-columns: 18px 26px minmax(0, 1fr);
        }
        .locked-result {
            grid-template-columns: 26px minmax(0, 1fr);
        }
        .topbar { align-items: flex-start; flex-direction: column; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>🇩🇪 Német szótanuló</h1>
    <div class="subtitle">Magyar → német gyakorlás</div>

    <section id="catalogScreen" class="card">
        <div class="topbar">
            <h2>Válassz egy szócsoportot</h2>
            <button id="historyButton" class="secondary">Előzmények</button>
        </div>
        <div id="catalogList" class="catalog-list"></div>
        <div class="catalog-actions">
            <button id="catalogGoButton" class="primary" disabled>Mehet ▶</button>
        </div>
        <div id="catalogError"></div>
    </section>

    <section id="groupChoiceScreen" class="card hidden">
        <div class="topbar">
            <div><h2 id="groupChoiceTitle"></h2><div class="subtitle" style="margin:0">Válassz, mit szeretnél csinálni</div></div>
            <button id="groupChoiceBackButton" class="secondary">Vissza</button>
        </div>
        <div class="group-choice">
            <button id="viewWordsButton" class="choice-button">📖 Szavak megtekintése</button>
            <button id="startPracticeButton" class="primary">▶ Gyakorlás</button>
        </div>
    </section>

    <section id="wordListScreen" class="card hidden">
        <div class="topbar">
            <div><h2 id="wordListTitle"></h2><div id="wordListCount" class="subtitle" style="margin:0"></div></div>
            <button id="wordListBackButton" class="secondary">Vissza</button>
        </div>
        <div id="wordList" class="word-list"></div>
    </section>

    <section id="practiceScreen" class="card hidden">
        <div class="topbar">
            <div>
                <h2 id="practiceTitle"></h2>
                <div id="counter" class="subtitle" style="margin:0"></div>
            </div>
            <button id="backButton" class="secondary">Vissza</button>
        </div>

        <div class="progress"><div id="progressBar"></div></div>

        <div id="questionArea">
            <div class="question">
                <div class="question-label">Fordítsd németre:</div>
                <div id="questionWord" class="word"></div>

                <form id="answerForm" class="answer-row">
                    <input id="answerInput" type="text" autocomplete="off" spellcheck="false" autofocus>
                    <button class="primary" type="submit">Ellenőrzés</button>
                </form>

                <div id="feedback" class="feedback"></div>
            </div>
        </div>

        <div id="currentResults" class="results"></div>
    </section>

    <section id="verbPracticeScreen" class="card hidden">
        <div class="topbar">
            <div>
                <h2 id="verbPracticeTitle"></h2>
                <div id="verbCounter" class="subtitle" style="margin:0"></div>
            </div>
            <button id="verbBackButton" class="secondary">Vissza</button>
        </div>

        <div class="progress"><div id="verbProgressBar"></div></div>

        <div class="question verb-question">
            <div class="question-label">Írd le a megadott ige két alakját:</div>
            <div id="verbQuestionWord" class="word"></div>

            <form id="verbAnswerForm" class="verb-answers">
                <div class="verb-answer-row">
                    <label for="verbPraesensInput">Präsens (E/3):</label>
                    <input id="verbPraesensInput" type="text" autocomplete="off" spellcheck="false">
                </div>
                <div class="verb-answer-row">
                    <label for="verbPraeteritumInput">Präteritum:</label>
                    <input id="verbPraeteritumInput" type="text" autocomplete="off" spellcheck="false">
                </div>
                <div class="verb-answer-row">
                    <label for="verbPerfektInput">Perfekt:</label>
                    <input id="verbPerfektInput" type="text" autocomplete="off" spellcheck="false">
                </div>
                <button class="primary" type="submit">Ellenőrzés</button>
                <div id="verbFeedback" class="feedback"></div>
            </form>
        </div>

        <div id="verbCurrentResults" class="results"></div>
    </section>

    <section id="mixedPracticeScreen" class="card hidden">
        <div class="topbar">
            <div>
                <h2 id="mixedPracticeTitle"></h2>
                <div id="mixedCounter" class="subtitle" style="margin:0"></div>
            </div>
            <button id="mixedBackButton" class="secondary">Vissza</button>
        </div>

        <div class="progress"><div id="mixedProgressBar"></div></div>

        <div class="question mixed-question">
            <div id="mixedQuestionLabel" class="question-label"></div>
            <div id="mixedQuestionWord" class="word"></div>
            <form id="mixedAnswerForm" class="verb-answers"></form>
            <div id="mixedFeedback" class="feedback"></div>
        </div>

        <div id="mixedCurrentResults" class="results"></div>
    </section>

    <section id="summaryScreen" class="card hidden">
        <div class="topbar">
            <h2>Kör vége</h2>
            <button id="summaryBackButton" class="secondary">Szócsoportok</button>
        </div>

        <div id="summaryStats" class="summary"></div>
        <div id="summaryResults" class="results"></div>
    </section>

    <section id="historyScreen" class="card hidden">
        <div class="topbar">
            <h2>Előzmények</h2>
            <button id="historyBackButton" class="secondary">Szócsoportok</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </section>

    <section id="historyDetailScreen" class="card hidden">
        <div class="topbar">
            <h2 id="historyDetailTitle"></h2>
            <button id="historyDetailBackButton" class="secondary">Előzmények</button>
        </div>
        <div id="historyDetailStats" class="summary"></div>
        <div id="historyDetailResults" class="results"></div>
    </section>
</div>

<script>
(() => {
    "use strict";

    const STORAGE_KEY = "deutsch-word-practice-history-v1";

    let catalog = [];
    let words = [];
    let currentWordIndex = 0;
    let currentResults = [];
    let currentCatalog = null;
    let selectedCatalogs = [];
    let answered = false;
    let roundQueue = [];
    let roundNumber = 1;

    const $ = id => document.getElementById(id);

    function show(screenId) {
        ["catalogScreen", "groupChoiceScreen", "wordListScreen",
         "practiceScreen", "verbPracticeScreen", "mixedPracticeScreen", "summaryScreen",
         "historyScreen", "historyDetailScreen"].forEach(id => {
            $(id).classList.toggle("hidden", id !== screenId);
        });
    }

    function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function normalizeAnswer(value) {
        return value.trim();
    }

    function loadHistory() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const data = JSON.parse(raw);
            return Array.isArray(data) ? data : [];
        } catch {
            return [];
        }
    }

    function getAttemptScore(attempt) {
        if (typeof attempt.answerCount === "number" && typeof attempt.correctCount === "number") {
            return { correct: attempt.correctCount, total: attempt.answerCount };
        }
        if (typeof attempt.praesensCorrect === "boolean") {
            return {
                correct: (attempt.praesensCorrect ? 1 : 0) + (attempt.praeteritumCorrect ? 1 : 0) + (attempt.perfektCorrect ? 1 : 0),
                total: 3
            };
        }
        return { correct: attempt.correct ? 1 : 0, total: 1 };
    }

    function saveHistory() {
        const history = loadHistory();
        const allAttempts = currentResults.filter(Boolean).flatMap(x => x.attempts || []);
        const score = {
            correct: allAttempts.reduce((sum, attempt) => sum + getAttemptScore(attempt).correct, 0),
            total: allAttempts.reduce((sum, attempt) => sum + getAttemptScore(attempt).total, 0)
        };

        history.unshift({
            id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
            date: new Date().toISOString(),
            catalogId: currentCatalog.id || null,
            catalogName: currentCatalog.friendlyName,
            catalogPath: currentCatalog.path,
            type: currentCatalog.type || "words",
            score,
            questions: currentResults.filter(Boolean).map(x => ({
                hu: x.hu,
                type: x.type || null,
                infinitiv: x.infinitiv || null,
                praesens: x.praesens || null,
                singular: x.singular || null,
                plural: x.plural || null,
                article: x.article || null,
                expected: x.expected || null,
                praeteritum: x.praeteritum || null,
                perfekt: x.perfekt || null,
                attempts: x.attempts || [],
                answer: x.attempts?.length ? x.attempts[x.attempts.length - 1].answer || "" : "",
                correct: x.correct
            }))
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 200)));
    }

    function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleString("hu-HU", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    async function loadCatalog() {
        try {
            const response = await fetch("./catalog.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            catalog = await response.json();

            if (!Array.isArray(catalog)) {
                throw new Error("A catalog.json nem tömböt tartalmaz.");
            }

            renderCatalog();
        } catch (error) {
            $("catalogError").innerHTML =
                `<div class="error">Nem sikerült betölteni a catalog.json fájlt.\n\n${escapeHtml(error.message)}</div>`;
        }
    }

    function renderCatalog() {
        const container = $("catalogList");
        container.innerHTML = "";
        $("catalogGoButton").disabled = true;
        currentCatalog = null;

        if (catalog.length === 0) {
            container.innerHTML = `<div class="empty">Nincs szócsoport a katalógusban.</div>`;
            return;
        }

        selectedCatalogs = [];

        catalog.forEach((item, index) => {
            const button = document.createElement("button");
            button.className = "catalog-button";
            button.type = "button";
            button.innerHTML = `<span>${escapeHtml(item.friendlyName || `Szócsoport ${index + 1}`)}</span>`;
            button.addEventListener("click", () => {
                const selected = selectedCatalogs.includes(item);
                if (selected) {
                    selectedCatalogs = selectedCatalogs.filter(x => x !== item);
                    button.classList.remove("selected");
                    const check = button.querySelector(".catalog-check");
                    if (check) check.remove();
                } else {
                    selectedCatalogs.push(item);
                    button.classList.add("selected");
                    button.insertAdjacentHTML("beforeend", `<span class="catalog-check">✓</span>`);
                }

                currentCatalog = selectedCatalogs.length === 1 ? selectedCatalogs[0] : null;
                $("catalogGoButton").disabled = selectedCatalogs.length === 0;
            });
            container.appendChild(button);
        });
    }

    async function goToSelectedGroup() {
        if (!selectedCatalogs.length) return;

        if (selectedCatalogs.length === 1) {
            currentCatalog = selectedCatalogs[0];
            $("groupChoiceTitle").textContent = currentCatalog.friendlyName || "Szócsoport";
            show("groupChoiceScreen");
            return;
        }

        try {
            const loaded = await Promise.all(selectedCatalogs.map(async item => {
                const data = await loadGroupData(item);
                return data.items;
            }));

            currentCatalog = {
                id: selectedCatalogs.map(x => x.id).join("+") || "selected",
                friendlyName: selectedCatalogs.map(x => x.friendlyName).join(" + "),
                type: "mixed",
                path: null,
                items: loaded.flat()
            };

            $("groupChoiceTitle").textContent = currentCatalog.friendlyName;
            show("groupChoiceScreen");
        } catch (error) {
            alert(`Nem sikerült betölteni a kijelölt szócsoportokat:

${error.message}`);
        }
    }

    function showGroupChoice(item) {
        currentCatalog = item;
        $("groupChoiceTitle").textContent = item.friendlyName || "Szócsoport";
        show("groupChoiceScreen");
    }

    async function loadGroupData(item) {
        // A kezdőoldalon több szócsoport is kijelölhető; ilyenkor a már
        // betöltött elemeket közvetlenül használjuk, nem próbáljuk újra
        // a nem létező közös path-ról betölteni őket.
        if (Array.isArray(item.items)) {
            return { type: item.type || "mixed", items: item.items };
        }

        const response = await fetch(item.path, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("A szócsoport JSON fájlja nem tömböt tartalmaz.");

        const type = item.type || "words";

        const normalizeMixedItem = x => {
            if (!x || typeof x !== "object") return null;

            if (x.type === "verb" || (!x.type && typeof x.infinitiv === "string")) {
                if (typeof x.infinitiv !== "string" || typeof x.hu !== "string" ||
                    typeof x.praesens !== "string" || typeof x.praeteritum !== "string" ||
                    typeof x.perfekt !== "string") return null;
                return { ...x, type: "verb" };
            }

            if (x.type === "noun" || (!x.type && typeof x.singular === "string" && typeof x.plural === "string")) {
                if (typeof x.hu !== "string" || typeof x.singular !== "string" || typeof x.plural !== "string") return null;
                return { ...x, type: "noun", article: x.article || "die" };
            }

            if (x.type === "word" || (!x.type && typeof x.de === "string" && typeof x.hu === "string")) {
                if (typeof x.hu !== "string" || typeof x.de !== "string") return null;
                return { ...x, type: "word" };
            }

            return null;
        };

        if (type === "verbs") {
            const items = data.filter(x =>
                x && typeof x.infinitiv === "string" && typeof x.hu === "string" &&
                typeof x.praesens === "string" && typeof x.praeteritum === "string" &&
                typeof x.perfekt === "string"
            ).map(x => ({ ...x, type: "verb" }));
            if (!items.length) throw new Error("Az ige JSON-ban nincs érvényes ige.");
            return { type: "verbs", items };
        }

        if (type === "mixed") {
            const items = data.map(normalizeMixedItem).filter(Boolean);
            if (!items.length) throw new Error("A vegyes szócsoportban nincs érvényes elem.");
            return { type: "mixed", items };
        }

        // Régi típusok kompatibilitása.
        if (type === "praeteritum" || type === "perfekt") {
            const items = data.filter(x => x && typeof x.infinitiv === "string" && typeof x.hu === "string")
                .map(x => ({ ...x, type: "verb" }));
            if (!items.length) throw new Error("Az ige JSON-ban nincs érvényes ige.");
            return { type: "verbs", items };
        }

        const items = data.filter(x => x && typeof x.hu === "string" && typeof x.de === "string")
            .map(x => ({ ...x, type: "word" }));
        if (!items.length) throw new Error("A szócsoportban nincs érvényes szó.");
        return { type: "words", items };
    }

    function itemSortKey(word) {
        return word.type === "verb" ? word.infinitiv : word.type === "noun" ? word.singular : word.de;
    }

    async function showWordList(item) {
        try {
            const data = await loadGroupData(item);
            const sortedItems = [...data.items].sort((a, b) =>
                itemSortKey(a).localeCompare(itemSortKey(b), "de", { sensitivity: "base" })
            );

            $("wordListTitle").textContent = item.friendlyName || "Szócsoport";
            $("wordListCount").textContent = `${sortedItems.length} elem`;

            if (data.type === "words") {
                $("wordList").innerHTML = `
                    <div class="word-list-row word-list-header"><div>Német</div><div></div><div>Magyar</div></div>
                    ${sortedItems.map(word => `<div class="word-list-row"><div class="german">${escapeHtml(word.de)}</div><div class="dash">-</div><div>${escapeHtml(word.hu)}</div></div>`).join("")}
                `;
            } else if (data.type === "verbs") {
                $("wordList").innerHTML = `
                    <div class="verb-list-row verb-list-header"><div>Infinitiv</div><div>Präsens</div><div>Präteritum</div><div>Perfekt</div></div>
                    ${sortedItems.map(word => `
                        <div class="verb-list-row">
                            <div class="german">${escapeHtml(word.infinitiv)} <span class="verb-hu">(${escapeHtml(word.hu)})</span></div>
                            <div>${escapeHtml(word.praesens)}</div>
                            <div>${escapeHtml(word.praeteritum)}</div>
                            <div>${escapeHtml(word.perfekt)}</div>
                        </div>
                    `).join("")}
                `;
            } else {
                const groups = [
                    {
                        type: "word",
                        title: "Szavak",
                        items: sortedItems.filter(word => word.type === "word"),
                        render: word => `<div class="word-list-row"><div class="german">${escapeHtml(word.de)}</div><div class="dash">-</div><div>${escapeHtml(word.hu)}</div></div>`
                    },
                    {
                        type: "noun",
                        title: "Főnevek",
                        items: sortedItems.filter(word => word.type === "noun"),
                        render: word => `<div class="word-list-row"><div class="german">${escapeHtml(word.singular)} <span class="verb-hu">(${escapeHtml(word.hu)})</span></div><div class="dash">-</div><div>${escapeHtml(word.plural)}</div></div>`
                    },
                    {
                        type: "verb",
                        title: "Igék",
                        items: sortedItems.filter(word => word.type === "verb"),
                        render: word => `<div class="verb-list-row"><div class="german">${escapeHtml(word.infinitiv)} <span class="verb-hu">(${escapeHtml(word.hu)})</span></div><div>${escapeHtml(word.praesens)}</div><div>${escapeHtml(word.praeteritum)}</div><div>${escapeHtml(word.perfekt)}</div></div>`
                    }
                ];

                $("wordList").innerHTML = groups.filter(group => group.items.length).map(group => {
                    const header = group.type === "verb"
                        ? `<div class="verb-list-row verb-list-header"><div>Infinitiv</div><div>Präsens</div><div>Präteritum</div><div>Perfekt</div></div>`
                        : group.type === "noun"
                            ? `<div class="word-list-row word-list-header"><div>Singular</div><div></div><div>Plural</div></div>`
                            : `<div class="word-list-row word-list-header"><div>Német</div><div></div><div>Magyar</div></div>`;
                    return `<div class="word-list-type-title">${group.title}</div>${header}${group.items.map(group.render).join("")}`;
                }).join("");
            }
            show("wordListScreen");
        } catch (error) {
            alert(`Nem sikerült betölteni a szócsoportot:

${error.message}`);
        }
    }

    async function startPractice(item) {
        try {
            const data = await loadGroupData(item);

            if (data.type === "verbs") {
                startVerbPractice(item, data.items);
                return;
            }

            if (data.type === "mixed") {
                startMixedPractice(item, data.items);
                return;
            }

            currentCatalog = item;
            words = shuffle(data.items);
            currentWordIndex = 0;
            currentResults = [];
            roundQueue = words.map((word, index) => ({ word, originalIndex: index }));
            roundNumber = 1;
            answered = false;
            $("practiceTitle").textContent = item.friendlyName;
            $("feedback").className = "feedback";
            $("feedback").textContent = "";
            $("currentResults").innerHTML = "";
            show("practiceScreen");
            renderQuestion();
        } catch (error) {
            alert(`Nem sikerült betölteni a szócsoportot:

${error.message}`);
        }
    }

    function startVerbPractice(item, verbs) {
        currentCatalog = item;
        words = shuffle(verbs);
        currentWordIndex = 0;
        currentResults = [];
        roundQueue = words.map((word, index) => ({ word, originalIndex: index }));
        roundNumber = 1;
        answered = false;
        $("verbPracticeTitle").textContent = item.friendlyName;
        $("verbFeedback").className = "feedback";
        $("verbFeedback").textContent = "";
        $("verbCurrentResults").innerHTML = "";
        show("verbPracticeScreen");
        renderVerbQuestion();
    }

    function renderVerbQuestion() {
        const item = roundQueue[currentWordIndex];
        const word = item.word;
        answered = false;

        $("verbCounter").textContent = `${currentWordIndex + 1} / ${roundQueue.length} · ${roundNumber}. kör`;
        $("verbQuestionWord").innerHTML = `<div class="verb-question-infinitiv">${escapeHtml(word.infinitiv)}</div><div class="verb-question-hu">(${escapeHtml(word.hu)})</div>`;
        $("verbPraesensInput").value = "";
        $("verbPraeteritumInput").value = "";
        $("verbPerfektInput").value = "";
        $("verbPraesensInput").disabled = false;
        $("verbPraeteritumInput").disabled = false;
        $("verbPerfektInput").disabled = false;
        $("verbFeedback").className = "feedback";
        $("verbFeedback").textContent = "";
        $("verbProgressBar").style.width = `${(currentWordIndex / roundQueue.length) * 100}%`;
        setTimeout(() => $("verbPraesensInput").focus(), 0);
    }

    function checkVerbAnswer() {
        if (answered) return;

        const item = roundQueue[currentWordIndex];
        const word = item.word;
        const praesensAnswer = normalizeAnswer($("verbPraesensInput").value);
        const praeteritumAnswer = normalizeAnswer($("verbPraeteritumInput").value);
        const perfektAnswer = normalizeAnswer($("verbPerfektInput").value);
        const expectedPraesens = normalizeAnswer(word.praesens);
        const expectedPraeteritum = normalizeAnswer(word.praeteritum);
        const expectedPerfekt = normalizeAnswer(word.perfekt);
        const praesensCorrect = praesensAnswer === expectedPraesens;
        const praeteritumCorrect = praeteritumAnswer === expectedPraeteritum;
        const perfektCorrect = perfektAnswer === expectedPerfekt;
        const correct = praesensCorrect && praeteritumCorrect && perfektCorrect;

        answered = true;

        if (!currentResults[item.originalIndex]) {
            currentResults[item.originalIndex] = {
                hu: word.hu,
                infinitiv: word.infinitiv,
                praesens: expectedPraesens,
                praeteritum: expectedPraeteritum,
                perfekt: expectedPerfekt,
                attempts: [],
                correct: false
            };
        }

        const result = currentResults[item.originalIndex];
        result.attempts.push({
            praesens: praesensAnswer,
            praeteritum: praeteritumAnswer,
            perfekt: perfektAnswer,
            praesensCorrect,
            praeteritumCorrect,
            perfektCorrect,
            correct,
            round: roundNumber
        });

        if (correct) result.correct = true;

        const feedback = $("verbFeedback");
        if (correct) {
            feedback.className = "feedback good";
            feedback.innerHTML = "✓ Mindhárom alak helyes!";
        } else {
            feedback.className = "feedback bad";
            feedback.innerHTML = `
                <div>✕ Nem jó, ezt az igét újra kérdezzük.</div>
                <div class="verb-feedback-lines">
                    <div class="verb-feedback-line">Präsens: ${praesensCorrect ? "✓ helyes" : `✕ helyes: <strong>${escapeHtml(expectedPraesens)}</strong>`}</div>
                    <div class="verb-feedback-line">Präteritum: ${praeteritumCorrect ? "✓ helyes" : `✕ helyes: <strong>${escapeHtml(expectedPraeteritum)}</strong>`}</div>
                    <div class="verb-feedback-line">Perfekt: ${perfektCorrect ? "✓ helyes" : `✕ helyes: <strong>${escapeHtml(expectedPerfekt)}</strong>`}</div>
                </div>
                <button id="wrongVerbAnswerOk" class="primary" type="button" style="margin-top:12px;">OK</button>
            `;
        }

        $("verbPraesensInput").disabled = true;
        $("verbPraeteritumInput").disabled = true;
        $("verbPerfektInput").disabled = true;
        $("verbProgressBar").style.width = `${((currentWordIndex + 1) / roundQueue.length) * 100}%`;
        renderVerbCurrentResults();

        if (correct) {
            setTimeout(advanceToNextVerb, 1400);
        } else {
            $("wrongVerbAnswerOk").focus();
            $("wrongVerbAnswerOk").addEventListener("click", advanceToNextVerb);
        }
    }

    function advanceToNextVerb() {
        if (!answered) return;

        currentWordIndex++;

        if (currentWordIndex >= roundQueue.length) {
            const retryQueue = roundQueue.filter(item => !currentResults[item.originalIndex].correct);

            if (retryQueue.length === 0) {
                finishPractice();
                return;
            }

            roundQueue = shuffle(retryQueue);
            currentWordIndex = 0;
            roundNumber++;
            renderVerbCurrentResults();
            renderVerbQuestion();
        } else {
            renderVerbQuestion();
        }
    }

    function renderVerbCurrentResults() {
        const completed = currentResults.filter(Boolean);
        const retryMode = roundNumber > 1;

        $("verbCurrentResults").innerHTML = `
            <div class="round-summary">
                <strong>${completed.filter(x => x.correct).length} / ${completed.length}</strong>
                ige már mindhárom alakban helyes
            </div>
            ${completed.map(item => {
                const attempts = item.attempts || [];
                const last = attempts[attempts.length - 1];

                if (retryMode) {
                    return `
                        <div class="result-item locked-result">
                            <div class="result-icon ${item.correct ? "good" : "bad"}">${item.correct ? "✓" : "✕"}</div>
                            <div>
                                <div class="result-hu">${escapeHtml(item.infinitiv)} (${escapeHtml(item.hu)})</div>
                                <div class="result-detail">
                                    ${item.correct ? "Mindhárom alak helyes" : `Újra kérdezzük · utolsó kör: Präsens ${last?.praesensCorrect ? "✓" : "✕"}, Präteritum ${last?.praeteritumCorrect ? "✓" : "✕"}, Perfekt ${last?.perfektCorrect ? "✓" : "✕"}`}
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <details class="result-item">
                        <summary>
                            <span class="result-icon ${item.correct ? "good" : "bad"}">${item.correct ? "✓" : "✕"}</span>
                            <span>
                                <span class="result-hu">${escapeHtml(item.infinitiv)} (${escapeHtml(item.hu)})</span>
                                <span class="result-detail">${item.correct ? "Mindhárom alak helyes" : "Hibás"}</span>
                            </span>
                        </summary>
                        <div class="result-attempts">
                            ${attempts.map((attempt, index) => `
                                <div>
                                    ${index + 1}. kör: Präsens ${attempt.praesensCorrect ? "✓" : "✕"} <strong>${escapeHtml(attempt.praesens || "(üres)")}</strong> · Präteritum ${attempt.praeteritumCorrect ? "✓" : "✕"} <strong>${escapeHtml(attempt.praeteritum || "(üres)")}</strong> · Perfekt ${attempt.perfektCorrect ? "✓" : "✕"} <strong>${escapeHtml(attempt.perfekt || "(üres)")}</strong>
                                    ${attempt.praesensCorrect && attempt.praeteritumCorrect && attempt.perfektCorrect ? "" : `<br>Helyes: <strong>${escapeHtml(item.praesens)}</strong> · <strong>${escapeHtml(item.praeteritum)}</strong> · <strong>${escapeHtml(item.perfekt)}</strong>`}
                                </div>
                            `).join("")}
                        </div>
                    </details>
                `;
            }).join("")}
        `;
    }

    function startMixedPractice(item, items) {
        currentCatalog = item;
        words = shuffle(items);
        currentWordIndex = 0;
        currentResults = [];
        roundQueue = words.map((word, index) => ({ word, originalIndex: index }));
        roundNumber = 1;
        answered = false;
        $("mixedPracticeTitle").textContent = item.friendlyName;
        $("mixedFeedback").className = "feedback";
        $("mixedFeedback").textContent = "";
        $("mixedCurrentResults").innerHTML = "";
        show("mixedPracticeScreen");
        renderMixedQuestion();
    }

    function renderMixedQuestion() {
        const item = roundQueue[currentWordIndex];
        const word = item.word;
        answered = false;

        $("mixedCounter").textContent = `${currentWordIndex + 1} / ${roundQueue.length} · ${roundNumber}. kör`;
        if (word.type === "verb") {
            $("mixedQuestionWord").innerHTML = `<div class="verb-question-infinitiv">${escapeHtml(word.infinitiv)}</div><div class="verb-question-hu">(${escapeHtml(word.hu)})</div>`;
        } else {
            $("mixedQuestionWord").textContent = word.hu;
        }
        $("mixedFeedback").className = "feedback";
        $("mixedFeedback").textContent = "";
        $("mixedProgressBar").style.width = `${(currentWordIndex / roundQueue.length) * 100}%`;

        const form = $("mixedAnswerForm");
        if (word.type === "verb") {
            $("mixedQuestionLabel").textContent = "Írd le a megadott ige három alakját:";
            form.innerHTML = `
                <div class="multi-answer-row"><label>Präsens (E/3):</label><input id="mixedA1" type="text" autocomplete="off" spellcheck="false"></div>
                <div class="multi-answer-row"><label>Präteritum:</label><input id="mixedA2" type="text" autocomplete="off" spellcheck="false"></div>
                <div class="multi-answer-row"><label>Perfekt:</label><input id="mixedA3" type="text" autocomplete="off" spellcheck="false"></div>
                <button class="primary" type="submit">Ellenőrzés</button>`;
        } else if (word.type === "noun") {
            $("mixedQuestionLabel").textContent = "Írd le a főnév két alakját:";
            form.innerHTML = `
                <div class="multi-answer-row"><label>Singular:</label><input id="mixedA1" type="text" autocomplete="off" spellcheck="false"></div>
                <div class="multi-answer-row"><label>Plural:</label><input id="mixedA2" type="text" autocomplete="off" spellcheck="false"></div>
                <button class="primary" type="submit">Ellenőrzés</button>`;
        } else {
            $("mixedQuestionLabel").textContent = "Fordítsd németre:";
            form.innerHTML = `<input id="mixedA1" type="text" autocomplete="off" spellcheck="false"><button class="primary" type="submit">Ellenőrzés</button>`;
        }

        setTimeout(() => $("mixedA1").focus(), 0);
    }

    function checkMixedAnswer() {
        if (answered) return;

        const item = roundQueue[currentWordIndex];
        const word = item.word;
        const answers = [];
        const expected = [];
        const labels = [];

        if (word.type === "verb") {
            answers.push(normalizeAnswer($("mixedA1").value), normalizeAnswer($("mixedA2").value), normalizeAnswer($("mixedA3").value));
            expected.push(normalizeAnswer(word.praesens), normalizeAnswer(word.praeteritum), normalizeAnswer(word.perfekt));
            labels.push("Präsens", "Präteritum", "Perfekt");
        } else if (word.type === "noun") {
            answers.push(normalizeAnswer($("mixedA1").value), normalizeAnswer($("mixedA2").value));
            expected.push(normalizeAnswer(word.singular), normalizeAnswer(word.plural));
            labels.push("Singular", "Plural");
        } else {
            answers.push(normalizeAnswer($("mixedA1").value));
            expected.push(normalizeAnswer(word.de));
            labels.push("Válasz");
        }

        const correctFlags = answers.map((answer, i) => answer === expected[i]);
        const correct = correctFlags.every(Boolean);
        answered = true;

        if (!currentResults[item.originalIndex]) {
            currentResults[item.originalIndex] = {
                type: word.type,
                hu: word.hu,
                infinitiv: word.infinitiv || null,
                praesens: word.praesens || null,
                praeteritum: word.praeteritum || null,
                perfekt: word.perfekt || null,
                singular: word.singular || null,
                plural: word.plural || null,
                article: word.article || null,
                expected: word.de || null,
                attempts: [],
                correct: false
            };
        }

        const result = currentResults[item.originalIndex];
        result.attempts.push({ answers, expected, correctFlags, correct, round: roundNumber, answer: answers[0] || "", answerCount: answers.length, correctCount: correctFlags.filter(Boolean).length });
        if (correct) result.correct = true;

        const feedback = $("mixedFeedback");
        if (correct) {
            feedback.className = "feedback good";
            feedback.innerHTML = word.type === "verb" ? "✓ Mindhárom alak helyes!" : word.type === "noun" ? "✓ Mindkét alak helyes!" : "✓ Helyes!";
        } else {
            feedback.className = "feedback bad";
            feedback.innerHTML = `
                <div>✕ Nem jó, ezt újra kérdezzük.</div>
                <div class="verb-feedback-lines">
                    ${expected.map((value, i) => `<div class="verb-feedback-line">${escapeHtml(labels[i])}: ${correctFlags[i] ? "✓ helyes" : `✕ helyes: <strong>${escapeHtml(value)}</strong>`}</div>`).join("")}
                </div>
                <button id="wrongMixedAnswerOk" class="primary" type="button" style="margin-top:12px;">OK</button>`;
        }

        [...$("mixedAnswerForm").querySelectorAll("input")].forEach(input => input.disabled = true);
        $("mixedProgressBar").style.width = `${((currentWordIndex + 1) / roundQueue.length) * 100}%`;
        renderMixedCurrentResults();

        if (correct) setTimeout(advanceToNextMixed, 1400);
        else { $("wrongMixedAnswerOk").focus(); $("wrongMixedAnswerOk").addEventListener("click", advanceToNextMixed); }
    }

    function advanceToNextMixed() {
        if (!answered) return;
        currentWordIndex++;
        if (currentWordIndex >= roundQueue.length) {
            const retryQueue = roundQueue.filter(item => !currentResults[item.originalIndex].correct);
            if (retryQueue.length === 0) { finishPractice(); return; }
            roundQueue = shuffle(retryQueue);
            currentWordIndex = 0;
            roundNumber++;
            renderMixedCurrentResults();
            renderMixedQuestion();
        } else renderMixedQuestion();
    }

    function renderMixedCurrentResults() {
        const completed = currentResults.filter(Boolean);
        const retryMode = roundNumber > 1;
        $("mixedCurrentResults").innerHTML = `
            <div class="round-summary"><strong>${completed.filter(x => x.correct).length} / ${completed.length}</strong> elem már teljesen helyes</div>
            ${completed.map(item => {
                const last = item.attempts[item.attempts.length - 1];
                const title = item.type === "verb" ? `${item.infinitiv} (${item.hu})` : item.type === "noun" ? `${item.article || "die"} ${item.singular} (${item.hu})` : item.hu;
                return retryMode ? `
                    <div class="result-item locked-result"><div class="result-icon ${item.correct ? "good" : "bad"}">${item.correct ? "✓" : "✕"}</div><div><div class="result-hu">${escapeHtml(title)}</div><div class="result-detail">${item.correct ? "Helyes" : "Újra kérdezzük"}</div></div></div>` : `
                    <details class="result-item"><summary><span class="result-icon ${item.correct ? "good" : "bad"}">${item.correct ? "✓" : "✕"}</span><span><span class="result-hu">${escapeHtml(title)}</span><span class="result-detail">${item.correct ? "Helyes" : "Hibás"}</span></span></summary><div class="result-attempts">${(item.attempts || []).map((a,i) => `<div>${i+1}. kör: ${a.correct ? "✓" : "✕"} ${a.answers.map((x,j)=>`<strong>${escapeHtml(x || "(üres)")}</strong>`).join(" · ")}</div>`).join("")}</div></details>`;
            }).join("")}`;
    }

    function renderQuestion() {
        const item = roundQueue[currentWordIndex];
        const word = item.word;
        answered = false;

        $("counter").textContent =
            `${currentWordIndex + 1} / ${roundQueue.length} · ${roundNumber}. kör`;
        $("questionWord").textContent = word.hu;
        $("answerInput").value = "";
        $("answerInput").disabled = false;
        $("feedback").className = "feedback";
        $("feedback").textContent = "";
        $("progressBar").style.width =
            `${(currentWordIndex / roundQueue.length) * 100}%`;

        setTimeout(() => $("answerInput").focus(), 0);
    }

    function checkAnswer() {
        if (answered) return;

        const item = roundQueue[currentWordIndex];
        const word = item.word;
        const answer = normalizeAnswer($("answerInput").value);
        const expected = normalizeAnswer(word.de);
        const correct = answer === expected;

        answered = true;

        if (!currentResults[item.originalIndex]) {
            currentResults[item.originalIndex] = {
                hu: word.hu,
                expected,
                attempts: [],
                correct: false
            };
        }

        const result = currentResults[item.originalIndex];
        result.attempts.push({
            answer,
            correct,
            round: roundNumber
        });

        if (correct) {
            result.correct = true;
        }

        const feedback = $("feedback");

        if (correct) {
            feedback.className = "feedback good";
            feedback.innerHTML = "✓ Helyes!";
        } else {
            feedback.className = "feedback bad";
            feedback.innerHTML =
                `✕ Nem jó.<span class="correct-answer">Helyes: ${escapeHtml(expected)}</span>
                 <button id="wrongAnswerOk" class="primary" type="button"
                         style="margin-top:12px;">OK</button>`;
        }

        $("answerInput").disabled = true;
        $("progressBar").style.width =
            `${((currentWordIndex + 1) / roundQueue.length) * 100}%`;

        renderCurrentResults();

        if (correct) {
            setTimeout(advanceToNextWord, 1400);
        } else {
            $("wrongAnswerOk").focus();
            $("wrongAnswerOk").addEventListener("click", advanceToNextWord);
        }
    }

    function advanceToNextWord() {
        if (!answered) return;

        currentWordIndex++;

        if (currentWordIndex >= roundQueue.length) {
            // A kör végén csak a még soha nem helyesen megoldott szavak
            // kerülnek vissza a következő körbe.
            const retryQueue = roundQueue.filter(
                item => !currentResults[item.originalIndex].correct
            );

            if (retryQueue.length === 0) {
                finishPractice();
                return;
            }

            roundQueue = shuffle(retryQueue);
            currentWordIndex = 0;
            roundNumber++;

            renderCurrentResults();
            renderQuestion();
        } else {
            renderQuestion();
        }
    }

    function renderCurrentResults() {
        const completed = currentResults.filter(Boolean);
        const retryMode = roundNumber > 1;

        $("currentResults").innerHTML = `
            <div class="round-summary">
                <strong>${completed.filter(x => x.correct).length} / ${completed.length}</strong>
                szó már legalább egyszer helyes
            </div>
            ${completed.map(item => {
                const attempts = item.attempts || [];
                const last = attempts[attempts.length - 1];

                if (retryMode) {
                    // Gyakorlás közben a korábbi eredmények nem nyithatók ki.
                    return `
                        <div class="result-item locked-result">
                            <div class="result-icon ${item.correct ? "good" : "bad"}">
                                ${item.correct ? "✓" : "✕"}
                            </div>
                            <div>
                                <div class="result-hu">${escapeHtml(item.hu)}</div>
                                <div class="result-detail">
                                    ${item.correct
                                        ? "Már helyes"
                                        : `Újra kérdezzük · utolsó válasz: <strong>${escapeHtml(last?.answer || "(üres)")}</strong>`}
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <details class="result-item">
                        <summary>
                            <span class="result-icon ${item.correct ? "good" : "bad"}">
                                ${item.correct ? "✓" : "✕"}
                            </span>
                            <span>
                                <span class="result-hu">${escapeHtml(item.infinitiv ? `${item.infinitiv} (${item.hu})` : item.hu)}</span>
                                <span class="result-detail">
                                    ${item.correct ? "Helyes" : "Hibás"}
                                </span>
                            </span>
                        </summary>
                        <div class="result-attempts">
                            ${attempts.map((attempt, index) => `
                                <div>
                                    ${index + 1}. kör:
                                    ${attempt.correct ? "✓" : "✕"}
                                    <strong>${escapeHtml(attempt.answer || "(üres)")}</strong>
                                    ${attempt.correct ? "" : ` · Helyes: <strong>${escapeHtml(item.expected)}</strong>`}
                                </div>
                            `).join("")}
                        </div>
                    </details>
                `;
            }).join("")}
        `;
    }

    function finishPractice() {
        saveHistory();

        const allAttempts = currentResults
            .filter(Boolean)
            .flatMap(item => item.attempts || []);

        const score = allAttempts.reduce((sum, attempt) => {
            const s = getAttemptScore(attempt);
            return { correct: sum.correct + s.correct, total: sum.total + s.total };
        }, { correct: 0, total: 0 });
        const totalAnswers = score.total;
        const correctAnswers = score.correct;
        const totalWords = currentResults.filter(Boolean).length;

        const percentage = totalAnswers ? Math.round(correctAnswers / totalAnswers * 100) : 0;
        const ringClass = percentage > 90 ? "green" : percentage > 80 ? "yellow" : "red";
        const circumference = 2 * Math.PI * 110;
        const offset = circumference * (1 - percentage / 100);
        const confetti = percentage === 100 ? `
            <div class="confetti" aria-hidden="true">
                ${Array.from({ length: 28 }, (_, i) => {
                    const angle = (i / 28) * Math.PI * 2;
                    const radius = 105 + (i % 4) * 24;
                    const x = Math.round(Math.cos(angle) * radius);
                    const y = Math.round(Math.sin(angle) * radius);
                    return `<span style="--x:${x}px;--y:${y}px;animation-delay:${(i % 7) * 0.025}s"></span>`;
                }).join("")}
            </div>` : "";

        $("summaryStats").innerHTML = `
            <div class="score-result">
                ${confetti}
                <div class="score-ring ${ringClass}">
                    <svg viewBox="0 0 250 250" aria-label="${percentage}% eredmény">
                        <circle class="score-ring-track" cx="125" cy="125" r="110"></circle>
                        <circle class="score-ring-value" cx="125" cy="125" r="110" style="stroke-dashoffset:${offset};"></circle>
                    </svg>
                    <div class="score-center">
                        <div class="score-percent">${percentage}%</div>
                        <div class="score-caption">Kör vége</div>
                    </div>
                </div>
            </div>
            <div class="score-stats">
                <div>
                    <div class="summary-number">${correctAnswers} / ${totalAnswers}</div>
                    <div class="summary-label">helyes válasz</div>
                </div>
                <div>
                    <div class="summary-number">${totalWords}</div>
                    <div class="summary-label">megtanult elem</div>
                </div>
            </div>
        `;

        $("summaryResults").innerHTML = currentResults
            .filter(Boolean)
            .map(renderResultItem)
            .join("");

        show("summaryScreen");
    }

    function renderResultItem(item) {
        const attempts = item.attempts || [];
        const isVerb = Boolean(item.infinitiv && (item.praesens || item.praeteritum || item.perfekt));

        if (isVerb) {
            return `
                <details class="result-item">
                    <summary>
                        <span class="result-icon good">✓</span>
                        <span>
                            <span class="result-hu">${escapeHtml(item.infinitiv)} (${escapeHtml(item.hu)})</span>
                            <span class="result-detail">
                                ${attempts.length === 1 ? "Elsőre mindhárom helyes" : `${attempts.length}. próbálkozásra lett helyes`}
                            </span>
                        </span>
                    </summary>
                    <div class="result-attempts">
                        ${attempts.map((attempt, index) => `
                            <div>
                                ${index + 1}. kör:
                                Präsens ${attempt.praesensCorrect ? "✓" : "✕"} <strong>${escapeHtml(attempt.praesens || "(üres)")}</strong> ·
                                Präteritum ${attempt.praeteritumCorrect ? "✓" : "✕"} <strong>${escapeHtml(attempt.praeteritum || "(üres)")}</strong> ·
                                Perfekt ${attempt.perfektCorrect ? "✓" : "✕"} <strong>${escapeHtml(attempt.perfekt || "(üres)")}</strong>
                                ${attempt.praesensCorrect && attempt.praeteritumCorrect && attempt.perfektCorrect ? "" : `<br>Helyes: <strong>${escapeHtml(item.praesens)}</strong> · <strong>${escapeHtml(item.praeteritum)}</strong> · <strong>${escapeHtml(item.perfekt)}</strong>`}
                            </div>
                        `).join("")}
                    </div>
                </details>
            `;
        }

        if (item.singular && item.plural) {
            return `
                <details class="result-item">
                    <summary>
                        <span class="result-icon good">✓</span>
                        <span><span class="result-hu">${escapeHtml(item.singular)} (${escapeHtml(item.hu)})</span><span class="result-detail">${attempts.length === 1 ? "Elsőre mindkét alak helyes" : `${attempts.length}. próbálkozásra lett helyes`}</span></span>
                    </summary>
                    <div class="result-attempts">
                        ${attempts.map((attempt, index) => `
                            <div>${index + 1}. kör: ${attempt.correct ? "✓" : "✕"} <strong>${escapeHtml(attempt.answers ? attempt.answers.join(" · ") : (attempt.answer || "(üres)"))}</strong>
                            ${attempt.correct ? "" : `<br>Helyes: <strong>${escapeHtml(item.singular)}</strong> · <strong>${escapeHtml(item.plural)}</strong>`}</div>
                        `).join("")}
                    </div>
                </details>`;
        }

        return `
            <details class="result-item">
                <summary>
                    <span class="result-icon good">✓</span>
                    <span>
                        <span class="result-hu">${escapeHtml(item.hu)}</span>
                        <span class="result-detail">
                            ${attempts.length === 1 ? "Elsőre helyes" : `${attempts.length}. próbálkozásra lett helyes`}
                        </span>
                    </span>
                </summary>
                <div class="result-attempts">
                    ${attempts.map((attempt, index) => `
                        <div>
                            ${index + 1}. kör: ${attempt.correct ? "✓" : "✕"}
                            <strong>${escapeHtml(attempt.answer || "(üres)")}</strong>
                            ${attempt.correct ? "" : ` · Helyes: <strong>${escapeHtml(item.expected)}</strong>`}
                        </div>
                    `).join("")}
                </div>
            </details>
        `;
    }

    function renderHistory() {
        const history = loadHistory();
        const container = $("historyList");

        if (history.length === 0) {
            container.innerHTML = `<div class="empty">Még nincs korábbi kör.</div>`;
            return;
        }

        container.innerHTML = history.map((item, index) => `
            <button class="history-item" data-history-index="${index}">
                <div class="history-main">
                    <span>${escapeHtml(item.catalogName || "Ismeretlen szócsoport")}</span>
                    <span>${item.score.correct} / ${item.score.total} · ${item.score.total ? Math.round(item.score.correct / item.score.total * 100) : 0}%</span>
                </div>
                <div class="history-meta">${formatDate(item.date)}</div>
            </button>
        `).join("");

        container.querySelectorAll("[data-history-index]").forEach(button => {
            button.addEventListener("click", () => {
                showHistoryDetail(history[Number(button.dataset.historyIndex)]);
            });
        });
    }

    function showHistoryDetail(item) {
        $("historyDetailTitle").textContent = item.catalogName || "Korábbi kör";
        $("historyDetailStats").innerHTML = `
            <div>
                <div class="summary-number">${item.score.correct} / ${item.score.total}</div>
                <div class="summary-label">helyes válasz</div>
            </div>
            <div>
                <div class="summary-number">${item.score.total ? Math.round(item.score.correct / item.score.total * 100) : 0}%</div>
                <div class="summary-label">eredmény</div>
            </div>
            <div>
                <div class="summary-number">${escapeHtml(formatDate(item.date))}</div>
                <div class="summary-label">dátum</div>
            </div>
        `;

        $("historyDetailResults").innerHTML =
            item.questions.map(renderResultItem).join("");

        show("historyDetailScreen");
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    $("catalogGoButton").addEventListener("click", goToSelectedGroup);

    $("answerForm").addEventListener("submit", event => {
        event.preventDefault();
        checkAnswer();
    });

    $("verbAnswerForm").addEventListener("submit", event => {
        event.preventDefault();
        checkVerbAnswer();
    });

    $("mixedAnswerForm").addEventListener("submit", event => {
        event.preventDefault();
        checkMixedAnswer();
    });

    $("groupChoiceBackButton").addEventListener("click", () => show("catalogScreen"));
    $("viewWordsButton").addEventListener("click", () => showWordList(currentCatalog));
    $("startPracticeButton").addEventListener("click", () => startPractice(currentCatalog));
    $("wordListBackButton").addEventListener("click", () => show("groupChoiceScreen"));

    $("backButton").addEventListener("click", () => show("catalogScreen"));
    $("verbBackButton").addEventListener("click", () => show("catalogScreen"));
    $("mixedBackButton").addEventListener("click", () => show("catalogScreen"));
    $("summaryBackButton").addEventListener("click", () => show("catalogScreen"));
    $("historyButton").addEventListener("click", () => {
        renderHistory();
        show("historyScreen");
    });
    $("historyBackButton").addEventListener("click", () => show("catalogScreen"));
    $("historyDetailBackButton").addEventListener("click", () => {
        renderHistory();
        show("historyScreen");
    });

    loadCatalog();
})();
</script>
</body>
</html>
