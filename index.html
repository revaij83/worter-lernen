<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Német szótanuló</title>
<style>
    :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --good: #16a34a;
        --bad: #dc2626;
        --good-bg: #f0fdf4;
        --bad-bg: #fef2f2;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .container {
        width: min(900px, calc(100% - 32px));
        margin: 32px auto 60px;
    }

    h1 { margin: 0 0 8px; font-size: 30px; }
    h2 { margin: 0 0 18px; font-size: 22px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .hidden { display: none !important; }

    .catalog-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
    }

    button {
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font: inherit;
        cursor: pointer;
    }

    .catalog-button {
        text-align: left;
        background: #eef2ff;
        color: #312e81;
        border: 1px solid #c7d2fe;
        transition: .15s;
    }

    .catalog-button:hover {
        background: #e0e7ff;
        transform: translateY(-1px);
    }

    .group-choice { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:20px; }
    .group-choice button { min-height:90px; font-size:18px; font-weight:650; }
    .choice-button { background:#eef2ff; color:#312e81; border:1px solid #c7d2fe; }
    .choice-button:hover { background:#e0e7ff; }
    .word-list { margin-top:18px; overflow-x:auto; }
    .word-list-row { display:grid; grid-template-columns:280px 28px minmax(180px,1fr); column-gap:8px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--border); font-size:17px; }
    .word-list-row .german { font-weight:600; }
    .word-list-row .dash { text-align:center; color:var(--muted); }
    .word-list-header { font-size:14px; color:var(--muted); font-weight:650; border-bottom:2px solid var(--border); }

    .primary {
        background: var(--accent);
        color: white;
        min-width: 120px;
    }

    .primary:hover { background: var(--accent-hover); }

    .secondary {
        background: #eef0f3;
        color: var(--text);
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
    }

    .progress {
        height: 9px;
        background: #e5e7eb;
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 24px;
    }

    .progress > div {
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width .25s;
    }

    .question {
        text-align: center;
        padding: 24px 0 18px;
    }

    .question-label {
        color: var(--muted);
        font-size: 15px;
        margin-bottom: 8px;
    }

    .word {
        font-size: 40px;
        font-weight: 700;
        margin-bottom: 22px;
    }

    .answer-row {
        display: flex;
        max-width: 600px;
        margin: auto;
        gap: 10px;
    }

    input[type="text"] {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 20px;
        padding: 13px 15px;
        border: 2px solid var(--border);
        border-radius: 10px;
        outline: none;
    }

    input[type="text"]:focus { border-color: var(--accent); }

    .feedback {
        min-height: 72px;
        margin-top: 20px;
        border-radius: 12px;
        padding: 15px 18px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
    }

    .feedback.good {
        color: var(--good);
        background: var(--good-bg);
        animation: pop .25s ease-out;
    }

    .feedback.bad {
        color: var(--bad);
        background: var(--bad-bg);
        animation: shake .28s ease-in-out;
    }

    .correct-answer {
        display: block;
        margin-top: 5px;
        font-weight: 700;
    }

    @keyframes pop {
        0% { transform: scale(.96); opacity: .5; }
        100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-7px); }
        75% { transform: translateX(7px); }
    }

    .results {
        margin-top: 28px;
    }

    .result-item {
        display: grid;
        grid-template-columns: 28px 1fr 1fr;
        gap: 10px;
        align-items: start;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
    }

    .result-item:last-child { border-bottom: 0; }

    .result-icon.good { color: var(--good); font-weight: 800; }
    .result-icon.bad { color: var(--bad); font-weight: 800; }

    .result-hu { font-weight: 600; }
    .result-detail { color: var(--muted); }
    .result-detail strong { color: var(--text); }

    .summary {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .summary-number {
        font-size: 30px;
        font-weight: 750;
    }

    .summary-label {
        color: var(--muted);
        font-size: 14px;
    }

    .history-list {
        display: grid;
        gap: 10px;
    }

    .history-item {
        width: 100%;
        text-align: left;
        background: #fafafa;
        border: 1px solid var(--border);
        padding: 15px;
    }

    .history-item:hover { background: #f3f4f6; }

    .history-main {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        font-weight: 650;
    }

    .history-meta {
        color: var(--muted);
        font-size: 14px;
        margin-top: 5px;
    }

    .empty {
        color: var(--muted);
        padding: 12px 0;
    }

    .error {
        color: var(--bad);
        background: var(--bad-bg);
        border-radius: 10px;
        padding: 14px;
        white-space: pre-wrap;
    }

    @media (max-width: 600px) {
        .word-list-row { grid-template-columns:220px 28px minmax(180px,1fr); }
        .container { width: min(100% - 20px, 900px); margin-top: 20px; }
        .card { padding: 18px; }
        .word { font-size: 32px; }
        .answer-row { flex-direction: column; }
        .result-item { grid-template-columns: 26px 1fr; }
        .result-detail { grid-column: 2; }
        .topbar { align-items: flex-start; flex-direction: column; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>🇩🇪 Német szótanuló</h1>
    <div class="subtitle">Magyar → német gyakorlás</div>

    <section id="catalogScreen" class="card">
        <div class="topbar">
            <h2>Válassz egy szócsoportot</h2>
            <button id="historyButton" class="secondary">Előzmények</button>
        </div>
        <div id="catalogList" class="catalog-list"></div>
        <div id="catalogError"></div>
    </section>

    <section id="groupChoiceScreen" class="card hidden">
        <div class="topbar">
            <div><h2 id="groupChoiceTitle"></h2><div class="subtitle" style="margin:0">Válassz, mit szeretnél csinálni</div></div>
            <button id="groupChoiceBackButton" class="secondary">Vissza</button>
        </div>
        <div class="group-choice">
            <button id="viewWordsButton" class="choice-button">📖 Szavak megtekintése</button>
            <button id="startPracticeButton" class="primary">▶ Gyakorlás</button>
        </div>
    </section>

    <section id="wordListScreen" class="card hidden">
        <div class="topbar">
            <div><h2 id="wordListTitle"></h2><div id="wordListCount" class="subtitle" style="margin:0"></div></div>
            <button id="wordListBackButton" class="secondary">Vissza</button>
        </div>
        <div id="wordList" class="word-list"></div>
    </section>

    <section id="practiceScreen" class="card hidden">
        <div class="topbar">
            <div>
                <h2 id="practiceTitle"></h2>
                <div id="counter" class="subtitle" style="margin:0"></div>
            </div>
            <button id="backButton" class="secondary">Vissza</button>
        </div>

        <div class="progress"><div id="progressBar"></div></div>

        <div id="questionArea">
            <div class="question">
                <div class="question-label">Fordítsd németre:</div>
                <div id="questionWord" class="word"></div>

                <form id="answerForm" class="answer-row">
                    <input id="answerInput" type="text" autocomplete="off" spellcheck="false" autofocus>
                    <button class="primary" type="submit">Ellenőrzés</button>
                </form>

                <div id="feedback" class="feedback"></div>
            </div>
        </div>

        <div id="currentResults" class="results"></div>
    </section>

    <section id="summaryScreen" class="card hidden">
        <div class="topbar">
            <h2>Kör vége</h2>
            <button id="summaryBackButton" class="secondary">Szócsoportok</button>
        </div>

        <div id="summaryStats" class="summary"></div>
        <div id="summaryResults" class="results"></div>
    </section>

    <section id="historyScreen" class="card hidden">
        <div class="topbar">
            <h2>Előzmények</h2>
            <button id="historyBackButton" class="secondary">Szócsoportok</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </section>

    <section id="historyDetailScreen" class="card hidden">
        <div class="topbar">
            <h2 id="historyDetailTitle"></h2>
            <button id="historyDetailBackButton" class="secondary">Előzmények</button>
        </div>
        <div id="historyDetailStats" class="summary"></div>
        <div id="historyDetailResults" class="results"></div>
    </section>
</div>

<script>
(() => {
    "use strict";

    const STORAGE_KEY = "deutsch-word-practice-history-v1";

    let catalog = [];
    let words = [];
    let currentWordIndex = 0;
    let currentResults = [];
    let currentCatalog = null;
    let answered = false;
    let roundQueue = [];
    let roundNumber = 1;

    const $ = id => document.getElementById(id);

    function show(screenId) {
        ["catalogScreen", "groupChoiceScreen", "wordListScreen",
         "practiceScreen", "summaryScreen", "historyScreen",
         "historyDetailScreen"].forEach(id => {
            $(id).classList.toggle("hidden", id !== screenId);
        });
    }

    function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function normalizeAnswer(value) {
        return value.trim();
    }

    function loadHistory() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const data = JSON.parse(raw);
            return Array.isArray(data) ? data : [];
        } catch {
            return [];
        }
    }

    function saveHistory() {
        const history = loadHistory();
        history.unshift({
            id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
            date: new Date().toISOString(),
            catalogId: currentCatalog.id || null,
            catalogName: currentCatalog.friendlyName,
            catalogPath: currentCatalog.path,
            score: (() => {
                const allAttempts = currentResults
                    .filter(Boolean)
                    .flatMap(x => x.attempts || []);

                return {
                    correct: allAttempts.filter(attempt => attempt.correct).length,
                    total: allAttempts.length
                };
            })(),
            questions: currentResults.filter(Boolean).map(x => ({
                hu: x.hu,
                expected: x.expected,
                attempts: x.attempts || [],
                // Compatibility with the earlier history format.
                answer: (x.attempts && x.attempts.length)
                    ? x.attempts[x.attempts.length - 1].answer
                    : "",
                correct: x.correct
            }))
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 200)));
    }

    function formatDate(iso) {
        const d = new Date(iso);
        return d.toLocaleString("hu-HU", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    async function loadCatalog() {
        try {
            const response = await fetch("./catalog.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            catalog = await response.json();

            if (!Array.isArray(catalog)) {
                throw new Error("A catalog.json nem tömböt tartalmaz.");
            }

            renderCatalog();
        } catch (error) {
            $("catalogError").innerHTML =
                `<div class="error">Nem sikerült betölteni a catalog.json fájlt.\n\n${escapeHtml(error.message)}</div>`;
        }
    }

    function renderCatalog() {
        const container = $("catalogList");
        container.innerHTML = "";

        if (catalog.length === 0) {
            container.innerHTML = `<div class="empty">Nincs szócsoport a katalógusban.</div>`;
            return;
        }

        catalog.forEach((item, index) => {
            const button = document.createElement("button");
            button.className = "catalog-button";
            button.textContent = item.friendlyName || `Szócsoport ${index + 1}`;
            button.addEventListener("click", () => showGroupChoice(item));
            container.appendChild(button);
        });
    }

    function showGroupChoice(item) {
        currentCatalog = item;
        $("groupChoiceTitle").textContent = item.friendlyName || "Szócsoport";
        show("groupChoiceScreen");
    }

    async function loadGroupWords(item) {
        const response = await fetch(item.path, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const loadedWords = await response.json();
        if (!Array.isArray(loadedWords)) throw new Error("A szócsoport JSON fájlja nem tömböt tartalmaz.");
        const validWords = loadedWords.filter(x => x && typeof x.hu === "string" && typeof x.de === "string");
        if (validWords.length === 0) throw new Error("A szócsoportban nincs érvényes szó.");
        return validWords;
    }

    async function showWordList(item) {
        try {
            const wordsForList = await loadGroupWords(item);
            const sortedWords = [...wordsForList].sort((a,b) => a.de.localeCompare(b.de, "de", { sensitivity: "base" }));
            $("wordListTitle").textContent = item.friendlyName || "Szócsoport";
            $("wordListCount").textContent = `${sortedWords.length} szó`;
            $("wordList").innerHTML = `
                <div class="word-list-row word-list-header"><div>Német</div><div></div><div>Magyar</div></div>
                ${sortedWords.map(word => `<div class="word-list-row"><div class="german">${escapeHtml(word.de)}</div><div class="dash">-</div><div>${escapeHtml(word.hu)}</div></div>`).join("")}
            `;
            show("wordListScreen");
        } catch (error) {
            alert(`Nem sikerült betölteni a szócsoportot:

${error.message}`);
        }
    }

    async function startPractice(item) {
        try {
            const validWords = await loadGroupWords(item);

            currentCatalog = item;
            words = shuffle(validWords);
            currentWordIndex = 0;
            currentResults = [];
            roundQueue = words.map((word, index) => ({
                word,
                originalIndex: index
            }));
            roundNumber = 1;
            answered = false;

            $("practiceTitle").textContent = item.friendlyName;
            $("feedback").className = "feedback";
            $("feedback").textContent = "";
            $("currentResults").innerHTML = "";

            show("practiceScreen");
            renderQuestion();
        } catch (error) {
            alert(`Nem sikerült betölteni a szócsoportot:\n\n${error.message}`);
        }
    }

    function renderQuestion() {
        const item = roundQueue[currentWordIndex];
        const word = item.word;
        answered = false;

        $("counter").textContent =
            `${currentWordIndex + 1} / ${roundQueue.length} · ${roundNumber}. kör`;
        $("questionWord").textContent = word.hu;
        $("answerInput").value = "";
        $("answerInput").disabled = false;
        $("feedback").className = "feedback";
        $("feedback").textContent = "";
        $("progressBar").style.width =
            `${(currentWordIndex / roundQueue.length) * 100}%`;

        setTimeout(() => $("answerInput").focus(), 0);
    }

    function checkAnswer() {
        if (answered) return;

        const item = roundQueue[currentWordIndex];
        const word = item.word;
        const answer = normalizeAnswer($("answerInput").value);
        const expected = normalizeAnswer(word.de);
        const correct = answer === expected;

        answered = true;

        if (!currentResults[item.originalIndex]) {
            currentResults[item.originalIndex] = {
                hu: word.hu,
                expected,
                attempts: [],
                correct: false
            };
        }

        const result = currentResults[item.originalIndex];
        result.attempts.push({
            answer,
            correct,
            round: roundNumber
        });

        if (correct) {
            result.correct = true;
        }

        const feedback = $("feedback");

        if (correct) {
            feedback.className = "feedback good";
            feedback.innerHTML = "✓ Helyes!";
        } else {
            feedback.className = "feedback bad";
            feedback.innerHTML =
                `✕ Nem jó.<span class="correct-answer">Helyes: ${escapeHtml(expected)}</span>
                 <button id="wrongAnswerOk" class="primary" type="button"
                         style="margin-top:12px;">OK</button>`;
        }

        $("answerInput").disabled = true;
        $("progressBar").style.width =
            `${((currentWordIndex + 1) / roundQueue.length) * 100}%`;

        renderCurrentResults();

        if (correct) {
            setTimeout(advanceToNextWord, 1400);
        } else {
            $("wrongAnswerOk").focus();
            $("wrongAnswerOk").addEventListener("click", advanceToNextWord);
        }
    }

    function advanceToNextWord() {
        if (!answered) return;

        currentWordIndex++;

        if (currentWordIndex >= roundQueue.length) {
            // A kör végén csak a még soha nem helyesen megoldott szavak
            // kerülnek vissza a következő körbe.
            const retryQueue = roundQueue.filter(
                item => !currentResults[item.originalIndex].correct
            );

            if (retryQueue.length === 0) {
                finishPractice();
                return;
            }

            roundQueue = shuffle(retryQueue);
            currentWordIndex = 0;
            roundNumber++;

            renderCurrentResults();
            renderQuestion();
        } else {
            renderQuestion();
        }
    }

    function renderCurrentResults() {
        const completed = currentResults.filter(Boolean);
        const retryMode = roundNumber > 1;

        $("currentResults").innerHTML = `
            <div class="round-summary">
                <strong>${completed.filter(x => x.correct).length} / ${completed.length}</strong>
                szó már legalább egyszer helyes
            </div>
            ${completed.map(item => {
                const attempts = item.attempts || [];
                const last = attempts[attempts.length - 1];

                if (retryMode) {
                    // Gyakorlás közben a korábbi eredmények nem nyithatók ki.
                    return `
                        <div class="result-item locked-result">
                            <div class="result-icon ${item.correct ? "good" : "bad"}">
                                ${item.correct ? "✓" : "✕"}
                            </div>
                            <div>
                                <div class="result-hu">${escapeHtml(item.hu)}</div>
                                <div class="result-detail">
                                    ${item.correct
                                        ? "Már helyes"
                                        : `Újra kérdezzük · utolsó válasz: <strong>${escapeHtml(last?.answer || "(üres)")}</strong>`}
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <details class="result-item">
                        <summary>
                            <span class="result-icon ${item.correct ? "good" : "bad"}">
                                ${item.correct ? "✓" : "✕"}
                            </span>
                            <span>
                                <span class="result-hu">${escapeHtml(item.hu)}</span>
                                <span class="result-detail">
                                    ${item.correct ? "Helyes" : "Hibás"}
                                </span>
                            </span>
                        </summary>
                        <div class="result-attempts">
                            ${attempts.map((attempt, index) => `
                                <div>
                                    ${index + 1}. kör:
                                    ${attempt.correct ? "✓" : "✕"}
                                    <strong>${escapeHtml(attempt.answer || "(üres)")}</strong>
                                    ${attempt.correct ? "" : ` · Helyes: <strong>${escapeHtml(item.expected)}</strong>`}
                                </div>
                            `).join("")}
                        </div>
                    </details>
                `;
            }).join("")}
        `;
    }

    function finishPractice() {
        saveHistory();

        const allAttempts = currentResults
            .filter(Boolean)
            .flatMap(item => item.attempts || []);

        const totalAnswers = allAttempts.length;
        const correctAnswers = allAttempts.filter(attempt => attempt.correct).length;
        const totalWords = currentResults.filter(Boolean).length;

        $("summaryStats").innerHTML = `
            <div>
                <div class="summary-number">${correctAnswers} / ${totalAnswers}</div>
                <div class="summary-label">helyes válasz</div>
            </div>
            <div>
                <div class="summary-number">${totalAnswers ? Math.round(correctAnswers / totalAnswers * 100) : 0}%</div>
                <div class="summary-label">összes beírt válaszból</div>
            </div>
            <div>
                <div class="summary-number">${totalWords}</div>
                <div class="summary-label">megtanult szó</div>
            </div>
        `;

        $("summaryResults").innerHTML = currentResults
            .filter(Boolean)
            .map(renderResultItem)
            .join("");

        show("summaryScreen");
    }

    function renderResultItem(item) {
        const attempts = item.attempts || [];

        return `
            <details class="result-item">
                <summary>
                    <span class="result-icon good">✓</span>
                    <span>
                        <span class="result-hu">${escapeHtml(item.hu)}</span>
                        <span class="result-detail">
                            ${attempts.length === 1
                                ? "Elsőre helyes"
                                : `${attempts.length}. próbálkozásra lett helyes`}
                        </span>
                    </span>
                </summary>
                <div class="result-attempts">
                    ${attempts.map((attempt, index) => `
                        <div>
                            ${index + 1}. kör:
                            ${attempt.correct ? "✓" : "✕"}
                            <strong>${escapeHtml(attempt.answer || "(üres)")}</strong>
                            ${attempt.correct ? "" : ` · Helyes: <strong>${escapeHtml(item.expected)}</strong>`}
                        </div>
                    `).join("")}
                </div>
            </details>
        `;
    }

    function renderHistory() {
        const history = loadHistory();
        const container = $("historyList");

        if (history.length === 0) {
            container.innerHTML = `<div class="empty">Még nincs korábbi kör.</div>`;
            return;
        }

        container.innerHTML = history.map((item, index) => `
            <button class="history-item" data-history-index="${index}">
                <div class="history-main">
                    <span>${escapeHtml(item.catalogName || "Ismeretlen szócsoport")}</span>
                    <span>${item.score.correct} / ${item.score.total} · ${item.score.total ? Math.round(item.score.correct / item.score.total * 100) : 0}%</span>
                </div>
                <div class="history-meta">${formatDate(item.date)}</div>
            </button>
        `).join("");

        container.querySelectorAll("[data-history-index]").forEach(button => {
            button.addEventListener("click", () => {
                showHistoryDetail(history[Number(button.dataset.historyIndex)]);
            });
        });
    }

    function showHistoryDetail(item) {
        $("historyDetailTitle").textContent = item.catalogName || "Korábbi kör";
        $("historyDetailStats").innerHTML = `
            <div>
                <div class="summary-number">${item.score.correct} / ${item.score.total}</div>
                <div class="summary-label">helyes válasz</div>
            </div>
            <div>
                <div class="summary-number">${Math.round(item.score.correct / item.score.total * 100)}%</div>
                <div class="summary-label">eredmény</div>
            </div>
            <div>
                <div class="summary-number">${escapeHtml(formatDate(item.date))}</div>
                <div class="summary-label">dátum</div>
            </div>
        `;

        $("historyDetailResults").innerHTML =
            item.questions.map(renderResultItem).join("");

        show("historyDetailScreen");
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    $("answerForm").addEventListener("submit", event => {
        event.preventDefault();
        checkAnswer();
    });

    $("groupChoiceBackButton").addEventListener("click", () => show("catalogScreen"));
    $("viewWordsButton").addEventListener("click", () => showWordList(currentCatalog));
    $("startPracticeButton").addEventListener("click", () => startPractice(currentCatalog));
    $("wordListBackButton").addEventListener("click", () => show("groupChoiceScreen"));

    $("backButton").addEventListener("click", () => show("catalogScreen"));
    $("summaryBackButton").addEventListener("click", () => show("catalogScreen"));
    $("historyButton").addEventListener("click", () => {
        renderHistory();
        show("historyScreen");
    });
    $("historyBackButton").addEventListener("click", () => show("catalogScreen"));
    $("historyDetailBackButton").addEventListener("click", () => {
        renderHistory();
        show("historyScreen");
    });

    loadCatalog();
})();
</script>
</body>
</html>
